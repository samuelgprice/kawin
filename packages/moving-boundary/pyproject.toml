[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moving-boundary"
version = "0.0.1.dev0"
description = "Illingworth moving-boundary solvers using public kawin"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=2.0",
  "scipy",
  "tqdm",
  "kawin==0.5.0",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
addopts = "--strict-markers -m 'not slow'"
markers = [
  "slow: longer refinement studies; deselected by default, run with -m slow",
  "git: runs Git itself (historical tooling); deselected by the portable normal acceptance gate",
]

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["moving_boundary*"]
namespaces = false

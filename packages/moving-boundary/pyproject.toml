[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moving-boundary"
version = "0.0.1.dev0"
description = "Development bridge to the pinned Illingworth research fork of kawin"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "numpy",
  "kawin @ git+https://github.com/samuelgprice/kawin.git@5f4ad574f2b7348ee2f818b1a18b75c0c0325c2e",
]

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["moving_boundary*"]
namespaces = false
